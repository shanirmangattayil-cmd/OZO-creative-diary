plugins { id 'com.android.application' }

android {
    namespace 'com.ozocreatives.diary'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ozocreatives.diary'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        release {
            def ks = System.getenv('OZO_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('OZO_KEYSTORE_PASSWORD')
                keyAlias 'ozo'
                keyPassword System.getenv('OZO_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('OZO_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
