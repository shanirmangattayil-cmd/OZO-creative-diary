name: Publish signed APK
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat release/version.txt)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/Ozo-Creative-Diary.apk release/Ozo-Creative-Diary-Lite.apk --title "Ozo Creative Diary v$V" --notes "Ozo-Creative-Diary-Lite.apk has everything except the inbox and installs without Play Protect warnings. Ozo-Creative-Diary.apk also has the WhatsApp/Instagram inbox."
