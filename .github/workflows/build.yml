name: Build Ozo Creative Diary APK
on:
  push:
    branches: [main]
    paths: ['app/**', '!app/src/main/assets/**', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.OZO_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.OZO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASS" ]; then echo "SIGNED=0" >> "$GITHUB_ENV"; echo "No signing key here: building an unsigned APK to be signed by the owner."; exit 0; fi
          echo "SIGNED=1" >> "$GITHUB_ENV"
          printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ozo.jks"
          echo "OZO_KEYSTORE=$RUNNER_TEMP/ozo.jks" >> "$GITHUB_ENV"
      - name: Build unsigned APK (owner signs it)
        if: env.SIGNED == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/full/release/app-full-release-unsigned.apk full-unsigned.apk
          cp app/build/outputs/apk/lite/release/app-lite-release-unsigned.apk lite-unsigned.apk
          cp "$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)lib/apksigner.jar" apksigner.jar
          echo ${{ github.run_number }} > run.txt
          gh release delete unsigned --yes --cleanup-tag || true
          gh release create unsigned full-unsigned.apk lite-unsigned.apk apksigner.jar run.txt --prerelease --title "Unsigned build ${{ github.run_number }}" --notes "Not for installing. Signed copies are published as the latest release."
      - name: Build APK
        if: env.SIGNED == '1'
        env:
          OZO_KEYSTORE_PASSWORD: ${{ secrets.OZO_KEYSTORE_PASSWORD }}
        run: |
          export OZO_KEYSTORE_PASSWORD="$(printf '%s' "$OZO_KEYSTORE_PASSWORD" | tr -d ' \r\n')"
          gradle assembleRelease --no-daemon
      - name: Publish download link
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk Ozo-Creative-Diary.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Ozo-Creative-Diary-Lite.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Ozo-Creative-Diary.apk Ozo-Creative-Diary-Lite.apk --title "Ozo Creative Diary v${{ github.run_number }}" --notes "Ozo-Creative-Diary.apk has the WhatsApp/Instagram inbox. Ozo-Creative-Diary-Lite.apk has everything except the inbox and installs without Play Protect warnings."
